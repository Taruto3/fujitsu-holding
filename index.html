<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8f0010">
  <meta name="description" content="富士通持株会の保有株数と時価総額を管理する個人用Webアプリ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>富士通 持株メモ</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PERSONAL HOLDINGS</p>
        <h1>富士通 持株メモ</h1>
      </div>
      <div class="ticker" aria-label="銘柄コード">6702</div>
    </header>

    <section class="value-card" aria-labelledby="value-label">
      <div class="value-head">
        <p id="value-label">現在の時価総額</p>
        <span class="market">東証プライム</span>
      </div>
      <p class="market-value" id="marketValue">—<span>円</span></p>
      <div class="formula">
        <span id="sharesSummary">0 株</span>
        <span aria-hidden="true">×</span>
        <span id="priceSummary">— 円</span>
      </div>
      <div class="quote-meta">
        <p class="updated" id="updatedAt">終値を取得しています…</p>
        <button class="refresh-button" id="refreshQuote" type="button">終値を再取得</button>
      </div>
    </section>

    <section class="panel" aria-labelledby="input-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">MY POSITION</p>
          <h2 id="input-title">保有内容</h2>
        </div>
        <span class="save-state" id="saveState" aria-live="polite"></span>
      </div>

      <form id="holdingForm">
        <label for="shares">保有株数 <small>小数株にも対応</small></label>
        <div class="input-wrap">
          <input id="shares" name="shares" type="text" inputmode="decimal" autocomplete="off" placeholder="例 123.456">
          <span>株</span>
        </div>

        <label for="price">直近の終値 <small id="priceDate">自動取得</small></label>
        <div class="input-wrap">
          <input id="price" name="price" type="text" inputmode="decimal" autocomplete="off" placeholder="取得中" readonly>
          <span>円</span>
        </div>

        <button type="submit">保存して計算</button>
        <p class="error" id="error" role="alert"></p>
      </form>
    </section>

    <section class="note">
      <h2>このアプリについて</h2>
      <p>入力した内容は、このブラウザの中だけに保存されます。外部へ送信されません。</p>
      <p>終値はページを開いた時に自動取得します。取得できない場合は、最後に取得できた終値を表示します。</p>
      <p>株価・時価総額は参考値です。取引判断には証券会社の公式情報をご確認ください。</p>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
