name: Update closing price

on:
  schedule:
    # 平日16:10 JST（07:10 UTC）。祝日は直近営業日の値が維持されます。
    - cron: "10 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch latest completed daily close
        run: node scripts/update-quote.mjs
      - name: Commit changed quote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quote.json data/history.json
          git diff --cached --quiet || git commit -m "Update Fujitsu closing price"
          git push
